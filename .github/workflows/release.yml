name: Release

# release-please reads the conventional commits on main, keeps a release PR open
# with the next version + CHANGELOG, and tags + releases when that PR is merged.
# The publish job then ships the tagged commit to npm through OIDC trusted
# publishing (no token). The package publishes from the repo root: `files` is
# dist + bin + assets, and bin/ imports ../dist/cli.js.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      - name: Check tag matches package.json
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"

      - name: Publish to npm
        run: pnpm publish --no-git-checks --provenance --access public
